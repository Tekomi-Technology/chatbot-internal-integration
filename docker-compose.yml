name: chatbot-internal-integration

services:
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    ports:
      - "5679:3000"
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
